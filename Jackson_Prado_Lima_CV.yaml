    Open Source & Research Projects:
      - name: CYPHER — Center for Research in Cyber-Physical Systems and Society
        date: 2025
        highlights:
          - Designed the R&D architecture and technical plan for a R$ 3 million proposal submitted under FAPESC
            Public Call 29/2025 (Multilab II).
          - The proposed environment combined high-performance AI computing, robotics, digital twins, simulation,
            and safety-oriented validation research.
      - name: "[COLEMAN — Learning-Based Test Case Prioritization](https://github.com/jacksonpradolima/coleman)"
        date: 2017-present
        highlights:
          - Created COLEMAN during my PhD to prioritize CI test cases using multi-armed bandits, balancing exploration,
            exploitation, failure detection, and changing test suites through execution feedback.
          - The original approach uses historical test feedback and is language-agnostic and model-free; subsequent
            research extended it to highly configurable systems and contextual prioritization through CONSTANTINE.
          - The current open-source Python platform includes 37 selectable bandit policies, typed configuration,
            parameter sweeps, reproducible run identities, resumable checkpoints, provenance, and CLI and library
            interfaces.
          - Original methods and empirical studies were published in IEEE Transactions on Software Engineering and
            Empirical Software Engineering; later software capabilities extend that research foundation.
          - Designed a research program and roadmap to investigate COLEMAN's online-learning methods for signal
            allocation in an investment firm's systematic portfolio.
      - name: "[GSP-Py](https://github.com/jacksonpradolima/gsp-py)"
        date: 2017-present
        highlights:
          - Open-source Python implementation of Generalized Sequential Pattern mining, applicable to temporal behavior
            analysis, market-basket sequences, and user-journey discovery.
          - The project provides an optional Rust/PyO3 support-counting backend with a Python fallback, benchmark
            tooling, and property-based tests for algorithmic invariants.
          - An experimental CuPy backend accelerates singleton support counting; non-singleton candidates use the
            Rust or Python backend.
