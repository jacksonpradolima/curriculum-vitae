  sections:
    summary:
      - Chief of Technology and hands-on principal engineer with a PhD in Informatics focused on AI for software
        engineering. I provide technical leadership to 50+ engineers across client engagements and continue to ship
        production code, combining architecture, client partnership, delivery governance, data platforms, reliability,
        security, and AI-assisted engineering.
      - Led modernization that reduced a client's monthly cloud spend from US$70K to US$10K, equivalent to US$720K
        in annualized savings. Earlier, as Technical Lead, led recovery and ongoing delivery across a largely undocumented
        GCP/AWS estate spanning 185+ repositories and more than one million lines of code in the main repository, while restoring prioritization
        and release control in a Jira program of roughly 10,000 issues.
      - My research applies reinforcement learning and optimization to software engineering. My PhD studied multi-armed
        bandit approaches to CI test prioritization, with research published in IEEE Transactions on Software Engineering
        and Empirical Software Engineering; my MSc combined hyper-heuristics and multi-objective evolutionary optimization
        for higher-order mutation testing. I created COLEMAN and teach postgraduate courses in neural networks and
        search-based software engineering.
