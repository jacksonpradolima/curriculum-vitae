      - name: "[COLEMAN — Learning-Based Test Case Prioritization](https://github.com/jacksonpradolima/coleman)"
        date: "2017-present"
        highlights:
          - "Developed during my PhD to solve test case prioritization in continuous integration using multi-armed bandit algorithms, learning from execution feedback while balancing exploration, exploitation, failure detection, and test-suite volatility."
          - "Designed as a language-agnostic, model-free approach requiring only historical failure data, and extended to highly configurable systems and contextual test prioritization through the CONSTANTINE approach."
          - "Evolved into a reproducible Python experimentation platform with typed configuration, parameter sweeps, deterministic run identifiers, CLI and library interfaces, supporting research published in IEEE Transactions on Software Engineering and Empirical Software Engineering."

