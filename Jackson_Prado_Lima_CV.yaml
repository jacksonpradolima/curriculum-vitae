  sections:
    summary:
      - "Hands-on technology leader and principal software engineer combining executive decision-making, doctoral-level research, and production-grade engineering. I lead globally distributed teams and take ownership of high-stakes technical environments, from architecture, delivery governance, and cloud economics to security, incident response, and organizational standards. I have led major platform-recovery and modernization initiatives that reduced recurring cloud expenditure by more than 80% while improving reliability, scalability, and maintainability."
      - "My current frontier is agentic software engineering. I architect and deliver internal AI-assisted engineering platforms that combine reusable agent capabilities, specialized technical knowledge, workflow automation, code-review intelligence, empirical evaluation, and enforceable quality controls. I remain deeply hands-on across software, data, cloud, security, and infrastructure, using the right technology for the problem rather than treating any language or framework as an identity."
      - "I am also an active professor and researcher with a PhD in Computer Science focused on Software Engineering and Artificial Intelligence. My work spans multi-armed bandits, evolutionary computation, software testing, continuous integration, data-intensive systems, and LLM-enabled engineering. I have published in leading international journals, designed the technical plan for a R$ 3 million cyber-physical-systems research-center proposal, and consistently bridge research rigor with real-world engineering impact."

